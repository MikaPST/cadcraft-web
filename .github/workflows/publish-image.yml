name: Build and publish CADCraft Web

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Official upstream release tag (empty = latest)
        type: string
        required: false
      force_rebuild:
        description: Rebuild an already published release
        type: boolean
        default: false

  schedule:
    - cron: '17 2 * * *'

  push:
    branches: [main]
    paths:
      - README.md
      - Dockerfile
      - nginx.conf
      - .dockerignore
      - docker-compose.yml
      - .github/workflows/publish-image.yml

permissions:
  contents: write
  packages: write

concurrency:
  group: cadcraft-web-publish
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/mikapst/cadcraft-web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4
        with:
          path: packaging
          persist-credentials: false
      - name: Validate version-controlled packaging files
        shell: bash
        run: |
          set -euo pipefail
          for f in Dockerfile nginx.conf .dockerignore docker-compose.yml README.md; do
            test -s "packaging/$f" || { echo "::error::Missing packaging/$f"; exit 1; }
          done
      - name: Resolve official upstream release
        id: release
        uses: actions/github-script@v7
        env:
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        with:
          script: |
            const requested = (process.env.REQUESTED_TAG || '').trim();
            const repo = { owner: 'storytold', repo: 'cadcraft' };
            const response = requested
              ? await github.rest.repos.getReleaseByTag({ ...repo, tag: requested })
              : await github.rest.repos.getLatestRelease(repo);
            const data = response.data;

            if (!data.tag_name || data.draft) {
              throw new Error('No published upstream release found');
            }
            core.setOutput('tag', data.tag_name);
            core.setOutput('url', data.html_url);
            core.setOutput('name', data.name || `CADCraft ${data.tag_name}`);
            core.setOutput('body', data.body || 'No upstream release notes.');
            core.setOutput('prerelease', String(data.prerelease));
      - name: Check already published version
        id: check
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.release.outputs.tag }}
          FORCE: ${{ inputs.force_rebuild }}
        with:
          script: |
            let exists = false;
            try {
              await github.rest.repos.getReleaseByTag({
                ...context.repo,
                tag: process.env.TAG
              });
              exists = true;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            const force = process.env.FORCE === 'true' || context.eventName === 'push';
            core.setOutput('skip', String(exists && !force));
      - name: Checkout official CADCraft release
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: storytold/cadcraft
          ref: ${{ steps.release.outputs.tag }}
          path: upstream
          persist-credentials: false
      - name: Read official craft-fonts revision
        if: steps.check.outputs.skip != 'true'
        id: fonts
        shell: bash
        run: |
          set -euo pipefail
          release_workflow="upstream/.github/workflows/release.yml"

          if [[ ! -f "$release_workflow" ]]; then
            echo "::error::Official release workflow not found: $release_workflow"
            exit 1
          fi

          revision="$(awk '/^[[:space:]]*craft-fonts-ref:[[:space:]]*/ { print $2; exit }' "$release_workflow")"

          if [[ ! "$revision" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid or missing official craft-fonts-ref in $release_workflow"
            exit 1
          fi

          echo "ref=$revision" >> "$GITHUB_OUTPUT"

      - name: Checkout official pinned craft-fonts
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: ${{ steps.fonts.outputs.ref }}
          path: craft-fonts
          persist-credentials: false

      - name: Record upstream and font revisions
        if: steps.check.outputs.skip != 'true'
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "short=$(git -C upstream rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "fonts=$(git -C craft-fonts rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Rust WebAssembly toolchain
        if: steps.check.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.1"
          targets: wasm32-unknown-unknown
      - name: Install Trunk
        if: steps.check.outputs.skip != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Build official CADCraft web app
        if: steps.check.outputs.skip != 'true'
        working-directory: upstream/apps/cadcraft-web
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: '1'
          CADCRAFT_BUILD_SHA: ${{ steps.source.outputs.short }}
        run: trunk build --release
      - name: Verify output and prepare image context
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          site="upstream/dist/web"

          test -s "$site/index.html" || {
            echo "::error::Missing web entry point: $site/index.html"
            exit 1
          }
          find "$site" -type f -name '*.js' -print -quit | grep -q . || {
            echo '::error::Missing generated JavaScript assets'
            exit 1
          }
          find "$site" -type f -name '*.wasm' -print -quit | grep -q . || {
            echo '::error::Missing generated WebAssembly assets'
            exit 1
          }

          if grep -Eq '(src|href)="/[^/]' "$site/index.html"; then
            echo '::error::Root-absolute URL found in index.html'
            exit 1
          fi

          mkdir -p image-context/site image-context/legal
          cp -a "$site/." image-context/site/
          cp packaging/Dockerfile packaging/nginx.conf packaging/.dockerignore image-context/

          for file in LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md; do
            if [[ -f "upstream/$file" ]]; then
              cp "upstream/$file" image-context/legal/
            fi
          done

          while IFS= read -r -d '' file; do
            family="$(basename "$(dirname "$file")")"
            cp "$file" "image-context/legal/OFL-${family}.txt"
          done < <(find craft-fonts/fonts -type f -name OFL.txt -print0)
      - name: Set up QEMU
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        if: steps.check.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.release.outputs.tag }}
            type=raw,value=upstream-${{ steps.source.outputs.short }}
      - name: Publish multi-platform image
        if: steps.check.outputs.skip != 'true'
        id: image
        uses: docker/build-push-action@v6
        with:
          context: image-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Publish matching GitHub Release
        if: steps.check.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.release.outputs.tag }}
          UPSTREAM_NAME: ${{ steps.release.outputs.name }}
          UPSTREAM_URL: ${{ steps.release.outputs.url }}
          UPSTREAM_BODY: ${{ steps.release.outputs.body }}
          UPSTREAM_PRERELEASE: ${{ steps.release.outputs.prerelease }}
          SOURCE_SHA: ${{ steps.source.outputs.short }}
          FONTS_SHA: ${{ steps.source.outputs.fonts }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        with:
          script: |
            const tag = process.env.TAG;
            const image = 'ghcr.io/mikapst/cadcraft-web';
            const body = [
              `Independent Docker packaging for **${process.env.UPSTREAM_NAME}**.`,
              '',
              '## Docker image',
              `- \`${image}:latest\``,
              `- \`${image}:${tag}\``,
              `- \`${image}:upstream-${process.env.SOURCE_SHA}\``,
              '- Platforms: `linux/amd64`, `linux/arm64`',
              `- Manifest digest: \`${process.env.IMAGE_DIGEST}\``,
              '',
              `Official upstream release: ${process.env.UPSTREAM_URL}`,
              `Upstream source: \`${process.env.SOURCE_SHA}\``,
              `craft-fonts: \`${process.env.FONTS_SHA}\``,
              '',
              '## Official release notes',
              process.env.UPSTREAM_BODY,
              '',
              'This is community-maintained packaging, not an official CADCraft distribution.'
            ].join('\n');

            let existingRelease;
            try {
              const response = await github.rest.repos.getReleaseByTag({
                ...context.repo,
                tag
              });
              existingRelease = response.data;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            const release = {
              ...context.repo,
              name: `CADCraft Web ${tag}`,
              body,
              draft: false,
              prerelease: process.env.UPSTREAM_PRERELEASE === 'true'
            };

            if (existingRelease) {
              await github.rest.repos.updateRelease({
                ...release,
                release_id: existingRelease.id
              });
            } else {
              await github.rest.repos.createRelease({
                ...release,
                tag_name: tag,
                target_commitish: context.sha
              });
            }
